[project]
name = "act"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # ML frameworks
    "torch",
    "torchvision",
    "torchaudio",
    # ONNX ecosystem
    "onnx",
    "onnxruntime",
    "onnx2torch",
    "onnxconverter-common",
    "onnxscript",
    "onnx-simplifier",
    # Solvers
    "gurobipy",
    # Data / numerics
    "numpy",
    "networkx",
    "pandas",
    "scikit-learn",
    # Utilities
    "tqdm",
    "pyyaml",
    "psutil",
    # Notebook
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    # ML extras
    "transformers",
]
